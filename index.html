<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توصيلة Pro - نظام المحاسبة الرسمي</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --dark-bg: #0a0a0c;
            --card-gray: #16161a;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 0;
        }

        .top-bar {
            position: sticky; top: 0;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 15px; z-index: 100;
            border-bottom: 1px solid #333;
        }

        .search-box {
            width: 100%; background: #1e1e22; border: 1px solid #444;
            color: #fff; padding: 12px; border-radius: 25px;
            box-sizing: border-box; outline: none; font-size: 16px;
        }

        .container { padding: 15px; padding-bottom: 100px; }

        .brand { text-align: center; margin: 10px 0 20px 0; }
        .brand h1 { color: var(--neon-blue); margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px var(--neon-blue); }

        .add-card { background: var(--card-gray); border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 1px solid #333; }
        .input-row { display: flex; flex-direction: column; gap: 10px; }
        
        input[type="text"], input[type="tel"] { background: #000; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 10px; font-size: 16px; }

        .btn-main { background: var(--neon-blue); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .rider-card { background: var(--card-gray); margin-bottom: 15px; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; border-right: 4px solid var(--neon-blue); transition: 0.3s; }
        .critical { border-right-color: var(--neon-red); box-shadow: 0 0 15px rgba(255, 49, 49, 0.3); }

        .rider-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .rider-info h3 { margin: 0; font-size: 1.2rem; }
        .rider-info p { margin: 4px 0 0 0; color: #888; font-size: 0.9rem; }
        .price-tag { color: var(--neon-red); font-weight: bold; font-size: 1.3rem; }

        .rider-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn-sm { padding: 10px 5px; border-radius: 8px; font-size: 0.8rem; border: none; font-weight: bold; cursor: pointer; }

        #invoice-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f4f4f4; z-index: 2000; color: #000; padding: 15px; box-sizing: border-box; overflow-y: auto; 
        }

        .invoice-paper {
            background: #fff; padding: 20px; border: 2px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px; margin: 0 auto; min-height: 80vh; position: relative;
        }

        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .invoice-header h2 { margin: 0; color: #000; }
        .invoice-header .date-box { text-align: left; font-size: 0.85rem; }

        .invoice-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.85rem; }
        .invoice-table th { background: #eee; border: 1px solid #ccc; padding: 8px; text-align: center; }
        .invoice-table td { border: 1px solid #ccc; padding: 8px; text-align: center; }

        .summary-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .box { padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; color: #fff; }
        .box-green { background: #2e7d32; }
        .box-red { background: #c62828; }

        .btn-edit { background: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-left: 2px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        .bankily-footer { text-align: center; margin-top: 25px; padding: 10px; border-top: 1px dashed #000; font-weight: bold; font-size: 1.1rem; }

        @media print { .no-print { display: none; } #invoice-modal { padding: 0; } .invoice-paper { border: none; } }
    </style>
</head>
<body>

<div class="top-bar">
    <input type="text" id="searchBar" class="search-box" onkeyup="render()" placeholder="ابحث عن دراج...">
</div>

<div class="container">
    <div class="brand">
        <h1>توصيلة</h1>
        <p>نظام المحاسبة الرسمي للمناديب</p>
    </div>

    <div class="add-card">
        <div class="input-row">
            <input type="text" id="nameInput" placeholder="اسم الدراج الجديد">
            <input type="tel" id="phoneInput" placeholder="رقم هاتفه">
            <button class="btn-main" onclick="addRider()">تسجيل في القائمة</button>
        </div>
    </div>

    <div id="ridersList"></div>

    <div style="text-align: center; margin-top: 20px;">
        <button onclick="exportData()" style="background:none; border:1px solid #333; color:#555; padding:8px 15px; border-radius:5px; font-size:12px;">حفظ نسخة احتياطية للبيانات</button>
    </div>
</div>

<div id="invoice-modal">
    <div class="invoice-paper">
        <div class="invoice-header">
            <div>
                <h2>توصيلة Pro</h2>
                <p style="margin:5px 0;">اسم الدراج: <b id="invRiderName"></b></p>
            </div>
            <div class="date-box">
                تاريخ الفاتورة<br>
                <span id="invDate"></span>
            </div>
        </div>
        
        <table class="invoice-table">
            <thead>
                <tr>
                    <th>الرحلة (من ← إلى)</th>
                    <th>السعر</th>
                    <th>النسبة</th>
                    <th class="no-print">إجراءات</th>
                </tr>
            </thead>
            <tbody id="invoiceItems"></tbody>
        </table>

        <div class="summary-boxes">
            <div class="box box-green">
                جميع الأموال المحصلة<br>
                <span id="totalGross" style="font-size: 1.3rem;"></span>
            </div>
            <div class="box box-red">
                النسبة المطلوبة للشركة<br>
                <span id="totalFees" style="font-size: 1.3rem;"></span>
            </div>
        </div>

        <div class="bankily-footer">
            بنكيلي ⬅️ 26891144
        </div>

        <div class="no-print" style="margin-top:30px; display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button onclick="shareWhatsApp()" style="padding:15px; background:#25D366; color:#fff; border-radius:8px; border:none; font-weight:bold; cursor:pointer;">إرسال للواتساب</button>
            <button onclick="window.print()" style="padding:15px; background:#000; color:#fff; border-radius:8px; font-weight:bold; cursor:pointer;">طباعة / تصوير</button>
            <button onclick="closeInvoice()" style="grid-column: span 2; padding:12px; background:#eee; border:1px solid #ccc; border-radius:8px; cursor:pointer;">رجوع للقائمة</button>
        </div>
    </div>
</div>

<script>
    let riders = JSON.parse(localStorage.getItem('tawsila_final')) || [];
    let currentRiderId = null;

    const PROTECTED_NAME = "الديه"; 
    const PROTECTED_PHONE = "22261016";

    function addRider() {
        const name = document.getElementById('nameInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        if(!name) return;
        riders.unshift({ id: Date.now(), name, phone, courses: [], totalDebt: 0, totalGross: 0 });
        saveAndRender();
        document.getElementById('nameInput').value = '';
        document.getElementById('phoneInput').value = '';
    }

    function addCourse(id) {
        const r = riders.find(x => x.id === id);
        if(r.name === PROTECTED_NAME || r.phone === PROTECTED_PHONE) {
            alert("لا يمكنني اضافه نسبه او انتشار نسبه من صاحب الذي صنعني. لقد تمت برمجتي لأكون ذكياً، وأول قواعد الذكاء هي: لا تلمس ممتلكات سيدي الديه هو الذي صنعني وانا لن أقابل إحسانه بسوء معاملتي لذلك أكتب نسبته في ورقة فهنا لايمكنني أخذ اي نسبه من سيدي الديه");
            return;
        }

        const from = prompt("نقطة الانطلاق؟");
        const to = prompt("الوجهة؟");
        const price = parseFloat(prompt("السعر الإجمالي للرحلة؟"));
        
        if(from && to && !isNaN(price)) {
            const fee = price * 0.15;
            r.courses.push({ courseId: Date.now(), from, to, price, fee, date: new Date().toLocaleDateString('ar-EG') });
            calculateTotals(r);
            saveAndRender();
        }
    }

    function calculateTotals(rider) {
        rider.totalDebt = rider.courses.reduce((sum, c) => sum + c.fee, 0);
        rider.totalGross = rider.courses.reduce((sum, c) => sum + c.price, 0);
    }

    function deleteCourse(courseId) {
        if(confirm("هل تريد حذف هذه الرحلة نهائياً؟")) {
            const r = riders.find(x => x.id === currentRiderId);
            r.courses = r.courses.filter(c => c.courseId !== courseId);
            calculateTotals(r);
            saveAndRender();
            showInvoice(currentRiderId);
        }
    }

    function editCourse(courseId) {
        const r = riders.find(x => x.id === currentRiderId);
        const c = r.courses.find(x => x.courseId === courseId);
        
        const newFrom = prompt("تعديل نقطة الانطلاق:", c.from);
        const newTo = prompt("تعديل الوجهة:", c.to);
        const newPrice = parseFloat(prompt("تعديل السعر:", c.price));

        if(newFrom && newTo && !isNaN(newPrice)) {
            c.from = newFrom;
            c.to = newTo;
            c.price = newPrice;
            c.fee = newPrice * 0.15;
            calculateTotals(r);
            saveAndRender();
            showInvoice(currentRiderId);
        }
    }

    function showInvoice(id) {
        currentRiderId = id;
        const r = riders.find(x => x.id === id);
        
        document.getElementById('invRiderName').innerText = r.name;
        document.getElementById('invDate').innerText = new Date().toLocaleDateString('ar-EG');
        
        const itemsHtml = r.courses.map(c => `
            <tr>
                <td>${c.from} ← ${c.to}</td>
                <td>${c.price.toFixed(0)}</td>
                <td>${c.fee.toFixed(1)}</td>
                <td class="no-print">
                    <button class="btn-edit" onclick="editCourse(${c.courseId})">تعديل</button>
                    <button class="btn-delete" onclick="deleteCourse(${c.courseId})">حذف</button>
                </td>
            </tr>
        `).join('');
        
        document.getElementById('invoiceItems').innerHTML = itemsHtml;
        document.getElementById('totalGross').innerText = r.totalGross.toFixed(0) + " MRU";
        document.getElementById('totalFees').innerText = r.totalDebt.toFixed(1) + " MRU";
        document.getElementById('invoice-modal').style.display = 'block';
    }

    function shareWhatsApp() {
        const r = riders.find(x => x.id === currentRiderId);
        const date = new Date().toLocaleDateString('ar-EG');
        
        let text = `*📄 فاتورة حساب شركة توصيلة*\n`;
        text += `*التاريخ:* ${date}\n`;
        text += `*الدراج:* ${r.name}\n`;
        text += `--------------------------------\n`;
        text += `*تفاصيل الرحلات:*\n`;
        
        r.courses.forEach((c, index) => {
            text += `${index + 1}. ${c.from} ← ${c.to}\n`;
            text += `   السعر: ${c.price} | النسبة: ${c.fee.toFixed(1)}\n`;
        });
        
        text += `--------------------------------\n`;
        text += `*✅ إجمالي الأموال المحصلة:* ${r.totalGross.toFixed(0)} MRU\n`;
        text += `*🚩 النسبة المطلوبة للشركة:* ${r.totalDebt.toFixed(1)} MRU\n`;
        text += `--------------------------------\n`;
        text += `*📌 الدفع عبر بنكيلي:* 26891144\n`;
        
        const url = `https://wa.me/${r.phone}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }

    function settleAccount(id) {
        if(confirm("تأكيد استلام المبلغ بالكامل؟ سيتم تصفير حساب الدراج وحذفه من القائمة تلقائياً.")) {
            riders = riders.filter(x => x.id !== id);
            saveAndRender();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(riders));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "tawsila_backup.json";
        a.click();
    }

    function closeInvoice() { document.getElementById('invoice-modal').style.display = 'none'; }
    function saveAndRender() { localStorage.setItem('tawsila_final', JSON.stringify(riders)); render(); }

    function render() {
        const list = document.getElementById('ridersList');
        const term = document.getElementById('searchBar').value.toLowerCase();
        list.innerHTML = '';
        riders.filter(r => r.name.toLowerCase().includes(term)).forEach(r => {
            const isCritical = r.totalDebt > 500 ? 'critical' : '';
            list.innerHTML += `
                <div class="rider-card ${isCritical}">
                    <div class="rider-header">
                        <div class="rider-info"><h3>${r.name}</h3><p>📱 ${r.phone}</p></div>
                        <div class="price-tag">${r.totalDebt.toFixed(1)}</div>
                    </div>
                    <div class="rider-actions">
                        <button onclick="addCourse(${r.id})" style="background:#444; color:#fff;" class="btn-sm">+ رحلة</button>
                        <button onclick="showInvoice(${r.id})" style="background:#ffa500;" class="btn-sm">🧾 فاتورة</button>
                        <button onclick="settleAccount(${r.id})" style="background:var(--neon-green);" class="btn-sm">✅ تصفية</button>
                    </div>
                </div>`;
        });
    }
    render();
    document.getElementById('searchBar').focus();
</script>
</body>
</html>
